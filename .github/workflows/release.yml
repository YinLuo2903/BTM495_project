# Builds downloadable copies of the website and publishes them as a GitHub Release.
# Run it by pushing a version tag:  git tag v1.0.0 && git push origin v1.0.0
# (or start it by hand from the Actions tab, which builds without publishing).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm test && npm run build
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

  # One double-click program per OS, with Python built in.
  app:
    needs: frontend
    strategy:
      matrix:
        include:
          - { os: windows-latest, file: LPVR-Bike-Shop.exe, asset: LPVR-Bike-Shop-windows.exe }
          - { os: macos-latest, file: LPVR-Bike-Shop, asset: LPVR-Bike-Shop-macos }
          - { os: ubuntu-latest, file: LPVR-Bike-Shop, asset: LPVR-Bike-Shop-linux }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyinstaller pillow && pyinstaller packaging/lpvr.spec
      - name: Name the program for its OS
        shell: bash
        run: |
          mkdir out
          if [ "${{ runner.os }}" = macOS ]; then
            # Wrap it as "LPVR Bike Shop.app"; ditto zips it the way Finder does (keeps the app intact)
            packaging/macos-app.sh "dist/${{ matrix.file }}" "${GITHUB_REF_NAME#ver}" dist
            ditto -c -k --keepParent "dist/LPVR Bike Shop.app" "out/${{ matrix.asset }}.zip"
          else
            cp "dist/${{ matrix.file }}" "out/${{ matrix.asset }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: app-${{ runner.os }}
          path: out/*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: app-*
          merge-multiple: true
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
          body: |
            Download the file for your computer and open it; the site opens in your browser at http://localhost:8765/.
            Data is kept in a "LPVR Bike Shop" folder in your home folder.

            - **Windows:** `LPVR-Bike-Shop-windows.exe`. If SmartScreen warns, choose *More info → Run anyway*.
            - **macOS:** unzip `LPVR-Bike-Shop-macos.zip` and drag **LPVR Bike Shop** into Applications. The first time, right-click it → *Open* (it is not signed by Apple). It then opens from Spotlight or Launchpad.
            - **Linux:** `chmod +x LPVR-Bike-Shop-linux && ./LPVR-Bike-Shop-linux`.
