<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Events</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .events-container {
            max-width: 100%;
        }
        
        .form-section {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .form-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #0056b3;
        }
        
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background-color: #c82333;
        }
        
        .events-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .events-table thead {
            background-color: #007bff;
            color: white;
        }
        
        .events-table th,
        .events-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .events-table tbody tr:hover {
            background-color: #f5f5f5;
        }
        
        .action-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .action-buttons button {
            padding: 5px 10px;
            font-size: 0.9em;
        }
        
        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 1px solid;
        }
        
        .alert-success {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        
        .alert-error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        
        .alert-info {
            background-color: #d1ecf1;
            border-color: #bee5eb;
            color: #0c5460;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .event-capacity {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 0.9em;
        }
        
        .capacity-full {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .capacity-normal {
            background-color: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Dashboard</a>
        <h1>Manage Events</h1>
        <p>Create and manage events for your bike shop.</p>
        
        <div id="alertContainer"></div>
        
        <div class="form-section">
            <h2>Add/Edit Event</h2>
            <form id="eventForm">
                <div class="form-group">
                    <label for="eventName">Event Name *</label>
                    <input type="text" id="eventName" name="name" required placeholder="e.g., Monthly Bike Tour">
                </div>
                
                <div class="form-group">
                    <label for="eventDescription">Description</label>
                    <textarea id="eventDescription" name="description" placeholder="Event description..."></textarea>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventDate">Event Date & Time *</label>
                        <input type="datetime-local" id="eventDate" name="event_date" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="eventLocation">Location *</label>
                        <input type="text" id="eventLocation" name="location" required placeholder="e.g., Downtown Park">
                    </div>
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="eventCapacity">Capacity (max participants) *</label>
                        <input type="number" id="eventCapacity" name="capacity" required step="1" min="1" placeholder="0">
                    </div>
                    
                    <div class="form-group">
                        <label for="eventPrice">Price per Person ($)</label>
                        <input type="number" id="eventPrice" name="price" step="0.01" min="0" placeholder="0.00">
                    </div>
                </div>
                
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">💾 Save Event</button>
                    <button type="reset" class="btn btn-secondary">🔄 Clear Form</button>
                </div>
            </form>
        </div>
        
        <div class="events-container">
            <h2>Events List</h2>
            <div id="eventsTableContainer">
                <p>Loading events...</p>
            </div>
        </div>
    </div>
    
    <script>
        let events = [];
        let editingId = null;
        
        // Load events on page load
        async function loadEvents() {
            try {
                const response = await fetch('/api/events');
                events = await response.json();
                renderEventsTable();
            } catch (error) {
                showAlert('Error loading events: ' + error.message, 'error');
            }
        }
        
        // Render events table
        function renderEventsTable() {
            if (events.length === 0) {
                document.getElementById('eventsTableContainer').innerHTML = '<p>No events yet. Create one using the form above.</p>';
                return;
            }
            
            const tableHtml = `
                <table class="events-table">
                    <thead>
                        <tr>
                            <th>Event Name</th>
                            <th>Date</th>
                            <th>Location</th>
                            <th>Registrations</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${events.map(event => {
                            const eventDate = new Date(event.event_date);
                            const registrations = event.registrations || 0;
                            const capacity = event.capacity || 0;
                            const capacityClass = registrations >= capacity ? 'capacity-full' : 'capacity-normal';
                            const capacityText = `${registrations}/${capacity}`;
                            
                            return `
                                <tr>
                                    <td>${event.name}</td>
                                    <td>${eventDate.toLocaleDateString()} ${eventDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
                                    <td>${event.location}</td>
                                    <td><span class="event-capacity ${capacityClass}">${capacityText}</span></td>
                                    <td>$${parseFloat(event.price || 0).toFixed(2)}</td>
                                    <td class="action-buttons">
                                        <button class="btn btn-primary" onclick="editEvent(${event.id})">✏️ Edit</button>
                                        <button class="btn btn-danger" onclick="deleteEvent(${event.id})">🗑️ Delete</button>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('eventsTableContainer').innerHTML = tableHtml;
        }
        
        // Show alert
        function showAlert(message, type = 'success') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            document.getElementById('alertContainer').innerHTML = '';
            document.getElementById('alertContainer').appendChild(alertDiv);
            
            setTimeout(() => alertDiv.remove(), 5000);
        }
        
        // Edit event
        function editEvent(id) {
            const event = events.find(e => e.id === id);
            if (event) {
                const eventDateTime = new Date(event.event_date).toISOString().slice(0, 16);
                document.getElementById('eventName').value = event.name;
                document.getElementById('eventDescription').value = event.description || '';
                document.getElementById('eventDate').value = eventDateTime;
                document.getElementById('eventLocation').value = event.location;
                document.getElementById('eventCapacity').value = event.capacity;
                document.getElementById('eventPrice').value = event.price || 0;
                editingId = id;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
        
        // Delete event
        async function deleteEvent(id) {
            if (confirm('Are you sure you want to delete this event?')) {
                try {
                    const response = await fetch(`/api/events/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        showAlert('Event deleted successfully!');
                        loadEvents();
                    } else {
                        showAlert('Error deleting event', 'error');
                    }
                } catch (error) {
                    showAlert('Error deleting event: ' + error.message, 'error');
                }
            }
        }
        
        // Handle form submission
        document.getElementById('eventForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('eventName').value,
                description: document.getElementById('eventDescription').value,
                event_date: new Date(document.getElementById('eventDate').value).toISOString(),
                location: document.getElementById('eventLocation').value,
                capacity: parseInt(document.getElementById('eventCapacity').value),
                price: parseFloat(document.getElementById('eventPrice').value) || 0
            };
            
            try {
                let response;
                if (editingId) {
                    response = await fetch(`/api/events/${editingId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                    editingId = null;
                } else {
                    response = await fetch('/api/events', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                }
                
                if (response.ok) {
                    showAlert('Event saved successfully!');
                    document.getElementById('eventForm').reset();
                    loadEvents();
                } else {
                    showAlert('Error saving event', 'error');
                }
            } catch (error) {
                showAlert('Error saving event: ' + error.message, 'error');
            }
        });
        
        // Load events on page load
        loadEvents();
    </script>
</body>
</html>
