<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Orders</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .orders-container {
            max-width: 100%;
        }
        
        .filter-section {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-section input,
        .filter-section select {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }
        
        .filter-section button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .filter-section button:hover {
            background-color: #0056b3;
        }
        
        .status-update-form {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        
        .status-update-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
        }
        
        .orders-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .orders-table thead {
            background-color: #007bff;
            color: white;
        }
        
        .orders-table th,
        .orders-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .orders-table tbody tr:hover {
            background-color: #f5f5f5;
        }
        
        .order-id {
            font-weight: bold;
            color: #007bff;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            font-size: 0.9em;
        }
        
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        
        .status-completed {
            background-color: #d4edda;
            color: #155724;
        }
        
        .status-cancelled {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .action-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #0056b3;
        }
        
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background-color: #c82333;
        }
        
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background-color: #218838;
        }
        
        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 1px solid;
        }
        
        .alert-success {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        
        .alert-error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .order-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }
        
        .order-modal.active {
            display: block;
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        
        .close-btn {
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            color: #aaa;
        }
        
        .close-btn:hover {
            color: #000;
        }
        
        .order-detail {
            margin: 10px 0;
            padding: 10px;
            background-color: #f9f9f9;
            border-radius: 4px;
        }
        
        .order-detail-label {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Dashboard</a>
        <h1>Manage Orders</h1>
        <p>View all orders and update their status.</p>
        
        <div id="alertContainer"></div>
        
        <!-- Status Update Form -->
        <div class="status-update-form" id="updateForm">
            <h2>Update Order Status</h2>
            <form id="statusForm">
                <div class="form-group">
                    <label>Order ID</label>
                    <div id="formOrderId" style="padding: 8px; background: #f0f0f0; border-radius: 4px;"></div>
                </div>
                
                <div class="form-group">
                    <label for="updateStatus">New Status *</label>
                    <select id="updateStatus" required>
                        <option value="">-- Select Status --</option>
                        <option value="Pending">⏱️ Pending</option>
                        <option value="Completed">✓ Completed</option>
                        <option value="Cancelled">✗ Cancelled</option>
                    </select>
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary">✓ Update Status</button>
                    <button type="button" class="btn btn-secondary" onclick="cancelUpdate()">Cancel</button>
                </div>
            </form>
        </div>
        
        <!-- Filter Section -->
        <div class="filter-section">
            <input type="text" id="searchFilter" placeholder="Search by customer name or order ID..." style="flex: 1; min-width: 200px;">
            <select id="statusFilter">
                <option value="">All Orders</option>
                <option value="Pending">Pending</option>
                <option value="Completed">Completed</option>
                <option value="Cancelled">Cancelled</option>
            </select>
            <button onclick="applyFilters()">🔍 Filter</button>
            <button class="btn btn-danger" onclick="removeAllOrders()" style="background-color: #dc3545;">🗑️ Clear All</button>
        </div>
        
        <!-- Orders Table -->
        <div class="orders-container">
            <h2>All Orders</h2>
            <div id="ordersTableContainer">
                <p>Loading orders...</p>
            </div>
        </div>
    </div>
    
    <!-- Order Details Modal -->
    <div id="orderModal" class="order-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Order Details</h2>
                <button class="close-btn" onclick="closeOrderDetails()">×</button>
            </div>
            <div id="orderDetailsContent"></div>
        </div>
    </div>
    
    <script>
        let orders = [];
        let filteredOrders = [];
        
        // Load orders on page load
        async function loadOrders() {
            try {
                const response = await fetch('/api/orders');
                orders = await response.json();
                filteredOrders = [...orders];
                renderOrdersTable();
            } catch (error) {
                showAlert('Error loading orders: ' + error.message, 'error');
            }
        }
        
        // Render orders table
        function renderOrdersTable() {
            if (filteredOrders.length === 0) {
                document.getElementById('ordersTableContainer').innerHTML = '<p>No orders found.</p>';
                return;
            }
            
            const tableHtml = `
                <table class="orders-table">
                    <thead>
                        <tr>
                            <th>Order ID</th>
                            <th>Customer</th>
                            <th>Date</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filteredOrders.map(order => `
                            <tr>
                                <td class="order-id">#${order.id}</td>
                                <td>${order.customer_name || 'Unknown'}</td>
                                <td>${new Date(order.order_date).toLocaleDateString()}</td>
                                <td>$${parseFloat(order.total).toFixed(2)}</td>
                                <td>${getStatusBadge(order.status)}</td>
                                <td class="action-buttons">
                                    <button class="btn btn-primary" onclick="viewOrderDetails(${order.id})">👁️ View</button>
                                    <button class="btn btn-secondary" onclick="showUpdateForm(${order.id})">📝 Edit</button>
                                    <button class="btn btn-danger" onclick="deleteOrder(${order.id})">🗑️ Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('ordersTableContainer').innerHTML = tableHtml;
        }
        
        // Get status badge
        function getStatusBadge(status) {
            const statusClass = `status-${status.toLowerCase()}`;
            const statusIcon = status === 'Pending' ? '⏱️' : status === 'Completed' ? '✓' : '✗';
            return `<span class="status-badge ${statusClass}">${statusIcon} ${status}</span>`;
        }
        
        // Show update form
        function showUpdateForm(orderId) {
            document.getElementById('formOrderId').textContent = `#${orderId}`;
            document.getElementById('statusForm').dataset.orderId = orderId;
            document.getElementById('updateForm').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // Cancel update
        function cancelUpdate() {
            document.getElementById('updateForm').classList.remove('active');
            document.getElementById('statusForm').reset();
        }
        
        // View order details
        function viewOrderDetails(orderId) {
            const order = orders.find(o => o.id === orderId);
            if (order) {
                const detailsHtml = `
                    <div class="order-detail">
                        <div class="order-detail-label">Order ID:</div>
                        <div>#${order.id}</div>
                    </div>
                    <div class="order-detail">
                        <div class="order-detail-label">Customer:</div>
                        <div>${order.customer_name || 'Unknown'}</div>
                    </div>
                    <div class="order-detail">
                        <div class="order-detail-label">Order Date:</div>
                        <div>${new Date(order.order_date).toLocaleString()}</div>
                    </div>
                    <div class="order-detail">
                        <div class="order-detail-label">Status:</div>
                        <div>${getStatusBadge(order.status)}</div>
                    </div>
                    <div class="order-detail">
                        <div class="order-detail-label">Total Amount:</div>
                        <div style="font-size: 1.5em; color: #007bff; font-weight: bold;">$${parseFloat(order.total).toFixed(2)}</div>
                    </div>
                    <div class="order-detail">
                        <div class="order-detail-label">Items:</div>
                        <div>${order.items ? order.items.length + ' item(s)' : 'No items'}</div>
                    </div>
                    <div class="order-detail">
                        <div class="order-detail-label">Shipping Address:</div>
                        <div>${order.shipping_address || 'Not provided'}</div>
                    </div>
                `;
                document.getElementById('orderDetailsContent').innerHTML = detailsHtml;
                document.getElementById('orderModal').classList.add('active');
            }
        }
        
        // Close order details modal
        function closeOrderDetails() {
            document.getElementById('orderModal').classList.remove('active');
        }
        
        // Show alert
        function showAlert(message, type = 'success') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            document.getElementById('alertContainer').innerHTML = '';
            document.getElementById('alertContainer').appendChild(alertDiv);
            
            setTimeout(() => alertDiv.remove(), 5000);
        }
        
        // Apply filters
        function applyFilters() {
            const search = document.getElementById('searchFilter').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            
            filteredOrders = orders.filter(order => {
                const matchesSearch = 
                    order.id.toString().includes(search) ||
                    (order.customer_name || '').toLowerCase().includes(search);
                
                const matchesStatus = status === '' || order.status === status;
                
                return matchesSearch && matchesStatus;
            });
            
            renderOrdersTable();
        }
        
        // Delete order
        async function deleteOrder(orderId) {
            if (confirm('Are you sure you want to delete this order?')) {
                try {
                    const response = await fetch(`/api/orders/${orderId}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        showAlert('Order deleted successfully!');
                        loadOrders();
                    } else {
                        showAlert('Error deleting order', 'error');
                    }
                } catch (error) {
                    showAlert('Error deleting order: ' + error.message, 'error');
                }
            }
        }
        
        // Remove all orders
        async function removeAllOrders() {
            if (confirm('Are you sure you want to delete all orders? This cannot be undone.')) {
                try {
                    const response = await fetch('/api/orders', {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        showAlert('All orders deleted successfully!');
                        loadOrders();
                    } else {
                        showAlert('Error deleting orders', 'error');
                    }
                } catch (error) {
                    showAlert('Error deleting orders: ' + error.message, 'error');
                }
            }
        }
        
        // Handle status form submission
        document.getElementById('statusForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const orderId = document.getElementById('statusForm').dataset.orderId;
            const newStatus = document.getElementById('updateStatus').value;
            
            try {
                const response = await fetch(`/api/orders/${orderId}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: newStatus })
                });
                
                if (response.ok) {
                    showAlert('Order status updated successfully!');
                    cancelUpdate();
                    loadOrders();
                } else {
                    showAlert('Error updating order status', 'error');
                }
            } catch (error) {
                showAlert('Error updating order: ' + error.message, 'error');
            }
        });
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('orderModal');
            if (event.target === modal) {
                closeOrderDetails();
            }
        }
        
        // Load orders on page load
        loadOrders();
    </script>
</body>
</html>
