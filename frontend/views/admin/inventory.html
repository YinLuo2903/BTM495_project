<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Inventory</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .inventory-container {
            max-width: 100%;
        }
        
        .filter-section {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        
        .filter-section input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
        }
        
        .filter-section button {
            padding: 8px 15px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        
        .filter-section button:hover {
            background-color: #0056b3;
        }
        
        .stock-update-form {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            display: none;
        }
        
        .stock-update-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
        }
        
        .inventory-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .inventory-table thead {
            background-color: #007bff;
            color: white;
        }
        
        .inventory-table th,
        .inventory-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .inventory-table tbody tr:hover {
            background-color: #f5f5f5;
        }
        
        .stock-status {
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
        }
        
        .status-critical {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .status-low {
            background-color: #fff3cd;
            color: #856404;
        }
        
        .status-normal {
            background-color: #d4edda;
            color: #155724;
        }
        
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        
        .btn {
            padding: 6px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9em;
        }
        
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #0056b3;
        }
        
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 1px solid;
        }
        
        .alert-success {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        
        .alert-error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
        
        .history-modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
        }
        
        .history-modal.active {
            display: block;
        }
        
        .modal-content {
            background-color: white;
            margin: 5% auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 8px;
            width: 90%;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
        }
        
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
        
        .close-btn {
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
            color: #aaa;
        }
        
        .close-btn:hover {
            color: #000;
        }
        
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9em;
        }
        
        .history-table th,
        .history-table td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .history-table thead {
            background-color: #f0f0f0;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Dashboard</a>
        <h1>Manage Inventory</h1>
        <p>Update stock levels and view stock history for your items.</p>
        
        <div id="alertContainer"></div>
        
        <!-- Stock Update Form -->
        <div class="stock-update-form" id="updateForm">
            <h2>Update Stock Level</h2>
            <form id="stockForm">
                <div class="form-group">
                    <label for="updateItem">Select Item *</label>
                    <select id="updateItem" required></select>
                </div>
                
                <div class="form-group">
                    <label for="updateQuantity">Quantity Change *</label>
                    <input type="number" id="updateQuantity" required step="1" placeholder="Positive to add, negative to subtract">
                </div>
                
                <div class="form-group">
                    <label for="updateReason">Reason for Change *</label>
                    <select id="updateReason" required>
                        <option value="">-- Select Reason --</option>
                        <option value="purchase">Purchase</option>
                        <option value="sale">Sale</option>
                        <option value="adjustment">Inventory Adjustment</option>
                        <option value="damage">Damage</option>
                        <option value="return">Return</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="updateNotes">Notes (Optional)</label>
                    <input type="text" id="updateNotes" placeholder="Additional notes...">
                </div>
                
                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary">✓ Update Stock</button>
                    <button type="button" class="btn btn-secondary" onclick="cancelUpdate()">Cancel</button>
                </div>
            </form>
        </div>
        
        <!-- Filter Section -->
        <div class="filter-section">
            <input type="text" id="searchFilter" placeholder="Search items..." style="flex: 1; min-width: 200px;">
            <select id="statusFilter">
                <option value="">All Items</option>
                <option value="critical">Critical Stock</option>
                <option value="low">Low Stock</option>
                <option value="normal">Normal Stock</option>
            </select>
            <button onclick="applyFilters()">🔍 Filter</button>
        </div>
        
        <!-- Inventory Table -->
        <div class="inventory-container">
            <h2>Current Inventory</h2>
            <div id="inventoryTableContainer">
                <p>Loading inventory...</p>
            </div>
        </div>
    </div>
    
    <!-- History Modal -->
    <div id="historyModal" class="history-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="historyTitle">Stock History</h2>
                <button class="close-btn" onclick="closeHistory()">×</button>
            </div>
            <div id="historyContent"></div>
        </div>
    </div>
    
    <script>
        let items = [];
        let filteredItems = [];
        
        // Load items on page load
        async function loadItems() {
            try {
                const response = await fetch('/api/items');
                items = await response.json();
                filteredItems = [...items];
                renderInventoryTable();
                populateItemSelect();
            } catch (error) {
                showAlert('Error loading items: ' + error.message, 'error');
            }
        }
        
        // Populate item select dropdown
        function populateItemSelect() {
            const select = document.getElementById('updateItem');
            select.innerHTML = '<option value="">-- Select an Item --</option>' + 
                items.map(item => `<option value="${item.id}">${item.name}</option>`).join('');
        }
        
        // Render inventory table
        function renderInventoryTable() {
            if (filteredItems.length === 0) {
                document.getElementById('inventoryTableContainer').innerHTML = '<p>No items found.</p>';
                return;
            }
            
            const tableHtml = `
                <table class="inventory-table">
                    <thead>
                        <tr>
                            <th>Item Name</th>
                            <th>Category</th>
                            <th>Current Stock</th>
                            <th>Status</th>
                            <th>Price</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${filteredItems.map(item => `
                            <tr>
                                <td>${item.name}</td>
                                <td>${item.category || 'N/A'}</td>
                                <td>${item.stock}</td>
                                <td>${getStockStatusBadge(item.stock)}</td>
                                <td>$${parseFloat(item.price).toFixed(2)}</td>
                                <td class="action-buttons">
                                    <button class="btn btn-primary" onclick="showUpdateForm(${item.id})">📦 Update</button>
                                    <button class="btn btn-secondary" onclick="viewHistory(${item.id}, '${item.name}')">📋 History</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('inventoryTableContainer').innerHTML = tableHtml;
        }
        
        // Get stock status badge
        function getStockStatusBadge(stock) {
            if (stock <= 3) {
                return '<span class="stock-status status-critical">🔴 Critical</span>';
            } else if (stock < 10) {
                return '<span class="stock-status status-low">🟡 Low</span>';
            } else {
                return '<span class="stock-status status-normal">✓ Normal</span>';
            }
        }
        
        // Show update form
        function showUpdateForm(itemId) {
            document.getElementById('updateItem').value = itemId;
            document.getElementById('updateForm').classList.add('active');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
        
        // Cancel update
        function cancelUpdate() {
            document.getElementById('updateForm').classList.remove('active');
            document.getElementById('stockForm').reset();
        }
        
        // View stock history
        async function viewHistory(itemId, itemName) {
            document.getElementById('historyTitle').textContent = `Stock History - ${itemName}`;
            
            try {
                const response = await fetch(`/api/items/${itemId}/history`);
                const history = await response.json();
                
                if (history.length === 0) {
                    document.getElementById('historyContent').innerHTML = '<p>No stock history records found.</p>';
                } else {
                    const historyHtml = `
                        <table class="history-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Quantity Change</th>
                                    <th>Reason</th>
                                    <th>Notes</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${history.map(record => `
                                    <tr>
                                        <td>${new Date(record.timestamp).toLocaleString()}</td>
                                        <td>${record.quantity_change >= 0 ? '+' : ''}${record.quantity_change}</td>
                                        <td>${record.reason}</td>
                                        <td>${record.notes || '-'}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                    document.getElementById('historyContent').innerHTML = historyHtml;
                }
                
                document.getElementById('historyModal').classList.add('active');
            } catch (error) {
                showAlert('Error loading history: ' + error.message, 'error');
            }
        }
        
        // Close history modal
        function closeHistory() {
            document.getElementById('historyModal').classList.remove('active');
        }
        
        // Show alert
        function showAlert(message, type = 'success') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            document.getElementById('alertContainer').innerHTML = '';
            document.getElementById('alertContainer').appendChild(alertDiv);
            
            setTimeout(() => alertDiv.remove(), 5000);
        }
        
        // Apply filters
        function applyFilters() {
            const search = document.getElementById('searchFilter').value.toLowerCase();
            const status = document.getElementById('statusFilter').value;
            
            filteredItems = items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(search) || 
                                    (item.category || '').toLowerCase().includes(search);
                
                let matchesStatus = true;
                if (status === 'critical') {
                    matchesStatus = item.stock <= 3;
                } else if (status === 'low') {
                    matchesStatus = item.stock > 3 && item.stock < 10;
                } else if (status === 'normal') {
                    matchesStatus = item.stock >= 10;
                }
                
                return matchesSearch && matchesStatus;
            });
            
            renderInventoryTable();
        }
        
        // Handle stock form submission
        document.getElementById('stockForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                quantity_change: parseInt(document.getElementById('updateQuantity').value),
                reason: document.getElementById('updateReason').value,
                notes: document.getElementById('updateNotes').value,
                timestamp: new Date().toISOString()
            };
            
            try {
                const itemId = document.getElementById('updateItem').value;
                const response = await fetch(`/api/items/${itemId}/stock`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });
                
                if (response.ok) {
                    showAlert('Stock updated successfully!');
                    cancelUpdate();
                    loadItems();
                } else {
                    showAlert('Error updating stock', 'error');
                }
            } catch (error) {
                showAlert('Error updating stock: ' + error.message, 'error');
            }
        });
        
        // Close modal when clicking outside
        window.onclick = function(event) {
            const modal = document.getElementById('historyModal');
            if (event.target === modal) {
                closeHistory();
            }
        }
        
        // Load items on page load
        loadItems();
    </script>
</body>
</html>
