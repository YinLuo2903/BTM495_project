<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Items</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .items-container {
            max-width: 100%;
        }
        
        .form-section {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        
        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .form-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        
        .btn-primary {
            background-color: var(--ink);
            color: var(--ink);
        }
        
        .btn-primary:hover {
            background-color: var(--brand-dark);
        }
        
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background-color: #c82333;
        }
        
        .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .items-table thead {
            background-color: var(--ink);
            color: var(--ink);
        }
        
        .items-table th,
        .items-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .items-table tbody tr:hover {
            background-color: #f5f5f5;
        }
        
        .action-buttons {
            display: flex;
            gap: 5px;
        }
        
        .action-buttons button {
            padding: 5px 10px;
            font-size: 0.9em;
        }
        
        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 1px solid;
        }
        
        .alert-success {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        
        .alert-error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: var(--ink);
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Dashboard</a>
        <h1>Manage Items</h1>
        <p>Add, edit, or delete bike shop items from this page.</p>
        
        <div id="alertContainer"></div>
        
        <div class="form-section">
            <h2>Add/Edit Item</h2>
            <form id="itemForm">
                <div class="form-group">
                    <label for="itemName">Item Name *</label>
                    <input type="text" id="itemName" name="name" required placeholder="e.g., Mountain Bike">
                </div>
                
                <div class="form-group">
                    <label for="itemDescription">Description</label>
                    <textarea id="itemDescription" name="description" placeholder="Item description..."></textarea>
                </div>
                
                <div class="form-group">
                    <label for="itemPrice">Price ($) *</label>
                    <input type="number" id="itemPrice" name="price" required step="0.01" min="0" placeholder="0.00">
                </div>
                
                <div class="form-group">
                    <label for="itemStock">Initial Stock *</label>
                    <input type="number" id="itemStock" name="stock" required step="1" min="0" placeholder="0">
                </div>
                
                <div class="form-group">
                    <label for="itemCategory">Category</label>
                    <input type="text" id="itemCategory" name="category" placeholder="e.g., Bikes, Accessories">
                </div>
                
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">💾 Save Item</button>
                    <button type="reset" class="btn btn-secondary">🔄 Clear Form</button>
                </div>
            </form>
        </div>
        
        <div class="items-container">
            <h2>Items Inventory</h2>
            <div id="itemsTableContainer">
                <p>Loading items...</p>
            </div>
        </div>
    </div>
    
    <script>
        let items = [];
        let editingId = null;
        
        // Load items on page load
        async function loadItems() {
            try {
                const response = await fetch('/api/items');
                items = await response.json();
                renderItemsTable();
            } catch (error) {
                showAlert('Error loading items: ' + error.message, 'error');
            }
        }
        
        // Render items table
        function renderItemsTable() {
            if (items.length === 0) {
                document.getElementById('itemsTableContainer').innerHTML = '<p>No items yet. Add one using the form above.</p>';
                return;
            }
            
            const tableHtml = `
                <table class="items-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Category</th>
                            <th>Price</th>
                            <th>Stock</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${items.map(item => `
                            <tr>
                                <td>${item.name}</td>
                                <td>${item.category || 'N/A'}</td>
                                <td>$${parseFloat(item.price).toFixed(2)}</td>
                                <td>${item.stock}</td>
                                <td class="action-buttons">
                                    <button class="btn btn-primary" onclick="editItem(${item.id})">✏️ Edit</button>
                                    <button class="btn btn-danger" onclick="deleteItem(${item.id})">🗑️ Delete</button>
                                </td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('itemsTableContainer').innerHTML = tableHtml;
        }
        
        // Show alert
        function showAlert(message, type = 'success') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            document.getElementById('alertContainer').innerHTML = '';
            document.getElementById('alertContainer').appendChild(alertDiv);
            
            setTimeout(() => alertDiv.remove(), 5000);
        }
        
        // Edit item
        function editItem(id) {
            const item = items.find(i => i.id === id);
            if (item) {
                document.getElementById('itemName').value = item.name;
                document.getElementById('itemDescription').value = item.description || '';
                document.getElementById('itemPrice').value = item.price;
                document.getElementById('itemStock').value = item.stock;
                document.getElementById('itemCategory').value = item.category || '';
                editingId = id;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
        
        // Delete item
        async function deleteItem(id) {
            if (confirm('Are you sure you want to delete this item?')) {
                try {
                    const response = await fetch(`/api/items/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        showAlert('Item deleted successfully!');
                        loadItems();
                    } else {
                        showAlert('Error deleting item', 'error');
                    }
                } catch (error) {
                    showAlert('Error deleting item: ' + error.message, 'error');
                }
            }
        }
        
        // Handle form submission
        document.getElementById('itemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                name: document.getElementById('itemName').value,
                description: document.getElementById('itemDescription').value,
                price: parseFloat(document.getElementById('itemPrice').value),
                stock: parseInt(document.getElementById('itemStock').value),
                category: document.getElementById('itemCategory').value
            };
            
            try {
                let response;
                if (editingId) {
                    response = await fetch(`/api/items/${editingId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                    editingId = null;
                } else {
                    response = await fetch('/api/items', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                }
                
                if (response.ok) {
                    showAlert('Item saved successfully!');
                    document.getElementById('itemForm').reset();
                    loadItems();
                } else {
                    showAlert('Error saving item', 'error');
                }
            } catch (error) {
                showAlert('Error saving item: ' + error.message, 'error');
            }
        });
        
        // Load items on page load
        loadItems();
    </script>
</body>
</html>
