<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Appointments</title>
    <link rel="stylesheet" href="../local_website.css">
    <style>
        .appointments-container {
            max-width: 100%;
        }
        
        .form-section {
            background: #f9f9f9;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #333;
        }
        
        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1em;
            box-sizing: border-box;
        }
        
        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .form-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1em;
        }
        
        .btn-primary {
            background-color: #007bff;
            color: white;
        }
        
        .btn-primary:hover {
            background-color: #0056b3;
        }
        
        .btn-secondary {
            background-color: #6c757d;
            color: white;
        }
        
        .btn-secondary:hover {
            background-color: #5a6268;
        }
        
        .btn-success {
            background-color: #28a745;
            color: white;
        }
        
        .btn-success:hover {
            background-color: #218838;
        }
        
        .btn-warning {
            background-color: #ffc107;
            color: #333;
        }
        
        .btn-warning:hover {
            background-color: #e0a800;
        }
        
        .btn-danger {
            background-color: #dc3545;
            color: white;
        }
        
        .btn-danger:hover {
            background-color: #c82333;
        }
        
        .appointments-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border: 1px solid #ddd;
            border-radius: 8px;
            overflow: hidden;
        }
        
        .appointments-table thead {
            background-color: #007bff;
            color: white;
        }
        
        .appointments-table th,
        .appointments-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }
        
        .appointments-table tbody tr:hover {
            background-color: #f5f5f5;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            text-align: center;
            font-size: 0.9em;
        }
        
        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }
        
        .status-confirmed {
            background-color: #d4edda;
            color: #155724;
        }
        
        .status-cancelled {
            background-color: #f8d7da;
            color: #721c24;
        }
        
        .status-completed {
            background-color: #cce5ff;
            color: #003f87;
        }
        
        .action-buttons {
            display: flex;
            gap: 5px;
            flex-wrap: wrap;
        }
        
        .action-buttons button {
            padding: 5px 10px;
            font-size: 0.9em;
        }
        
        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 1px solid;
        }
        
        .alert-success {
            background-color: #d4edda;
            border-color: #28a745;
            color: #155724;
        }
        
        .alert-error {
            background-color: #f8d7da;
            border-color: #f5c6cb;
            color: #721c24;
        }
        
        .alert-info {
            background-color: #d1ecf1;
            border-color: #bee5eb;
            color: #0c5460;
        }
        
        .back-link {
            display: inline-block;
            margin-bottom: 20px;
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        
        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← Back to Dashboard</a>
        <h1>Manage Appointments</h1>
        <p>Manage customer appointments for services and consultations.</p>
        
        <div id="alertContainer"></div>
        
        <div class="form-section">
            <h2>Add/Edit Appointment</h2>
            <form id="appointmentForm">
                <div class="form-group">
                    <label for="appointmentCustomer">Customer Name *</label>
                    <input type="text" id="appointmentCustomer" name="customer_name" required placeholder="e.g., John Doe">
                </div>
                
                <div class="form-group">
                    <label for="appointmentEmail">Customer Email *</label>
                    <input type="email" id="appointmentEmail" name="customer_email" required placeholder="john@example.com">
                </div>
                
                <div class="form-row">
                    <div class="form-group">
                        <label for="appointmentDate">Appointment Date & Time *</label>
                        <input type="datetime-local" id="appointmentDate" name="appointment_date" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="appointmentDuration">Duration (minutes)</label>
                        <input type="number" id="appointmentDuration" name="duration" step="15" min="15" value="60">
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="appointmentService">Service Type *</label>
                    <select id="appointmentService" name="service_type" required>
                        <option value="">-- Select Service --</option>
                        <option value="tune-up">Bike Tune-Up</option>
                        <option value="repair">General Repair</option>
                        <option value="brake-service">Brake Service</option>
                        <option value="wheel-service">Wheel Service</option>
                        <option value="consultation">Consultation</option>
                        <option value="fitting">Bike Fitting</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="appointmentNotes">Notes</label>
                    <textarea id="appointmentNotes" name="notes" placeholder="Additional appointment notes..."></textarea>
                </div>
                
                <div class="form-buttons">
                    <button type="submit" class="btn btn-primary">💾 Save Appointment</button>
                    <button type="reset" class="btn btn-secondary">🔄 Clear Form</button>
                </div>
            </form>
        </div>
        
        <div class="appointments-container">
            <h2>Appointments List</h2>
            <div id="appointmentsTableContainer">
                <p>Loading appointments...</p>
            </div>
        </div>
    </div>
    
    <script>
        let appointments = [];
        let editingId = null;
        
        // Load appointments on page load
        async function loadAppointments() {
            try {
                const response = await fetch('/api/appointments');
                appointments = await response.json();
                renderAppointmentsTable();
            } catch (error) {
                showAlert('Error loading appointments: ' + error.message, 'error');
            }
        }
        
        // Render appointments table
        function renderAppointmentsTable() {
            if (appointments.length === 0) {
                document.getElementById('appointmentsTableContainer').innerHTML = '<p>No appointments yet. Create one using the form above.</p>';
                return;
            }
            
            const tableHtml = `
                <table class="appointments-table">
                    <thead>
                        <tr>
                            <th>Customer Name</th>
                            <th>Date & Time</th>
                            <th>Service</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        ${appointments.map(appointment => {
                            const appDate = new Date(appointment.appointment_date);
                            return `
                                <tr>
                                    <td>${appointment.customer_name}</td>
                                    <td>${appDate.toLocaleDateString()} ${appDate.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</td>
                                    <td>${appointment.service_type || 'N/A'}</td>
                                    <td>${getStatusBadge(appointment.status)}</td>
                                    <td class="action-buttons">
                                        <button class="btn btn-primary" onclick="editAppointment(${appointment.id})">✏️ Edit</button>
                                        ${appointment.status === 'pending' ? 
                                            `<button class="btn btn-success" onclick="confirmAppointment(${appointment.id})">✓ Confirm</button>` : ''}
                                        ${appointment.status !== 'cancelled' ? 
                                            `<button class="btn btn-danger" onclick="cancelAppointment(${appointment.id})">✗ Cancel</button>` : ''}
                                        <button class="btn btn-secondary" onclick="deleteAppointment(${appointment.id})">🗑️ Delete</button>
                                    </td>
                                </tr>
                            `;
                        }).join('')}
                    </tbody>
                </table>
            `;
            document.getElementById('appointmentsTableContainer').innerHTML = tableHtml;
        }
        
        // Get status badge
        function getStatusBadge(status) {
            const statuses = {
                'pending': { class: 'status-pending', icon: '⏱️', text: 'Pending' },
                'confirmed': { class: 'status-confirmed', icon: '✓', text: 'Confirmed' },
                'cancelled': { class: 'status-cancelled', icon: '✗', text: 'Cancelled' },
                'completed': { class: 'status-completed', icon: '✅', text: 'Completed' }
            };
            const statusInfo = statuses[status] || statuses['pending'];
            return `<span class="status-badge ${statusInfo.class}">${statusInfo.icon} ${statusInfo.text}</span>`;
        }
        
        // Show alert
        function showAlert(message, type = 'success') {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type}`;
            alertDiv.textContent = message;
            document.getElementById('alertContainer').innerHTML = '';
            document.getElementById('alertContainer').appendChild(alertDiv);
            
            setTimeout(() => alertDiv.remove(), 5000);
        }
        
        // Edit appointment
        function editAppointment(id) {
            const appointment = appointments.find(a => a.id === id);
            if (appointment) {
                const appDateTime = new Date(appointment.appointment_date).toISOString().slice(0, 16);
                document.getElementById('appointmentCustomer').value = appointment.customer_name;
                document.getElementById('appointmentEmail').value = appointment.customer_email;
                document.getElementById('appointmentDate').value = appDateTime;
                document.getElementById('appointmentDuration').value = appointment.duration || 60;
                document.getElementById('appointmentService').value = appointment.service_type;
                document.getElementById('appointmentNotes').value = appointment.notes || '';
                editingId = id;
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }
        
        // Confirm appointment
        async function confirmAppointment(id) {
            try {
                const response = await fetch(`/api/appointments/${id}`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: 'confirmed' })
                });
                
                if (response.ok) {
                    showAlert('Appointment confirmed!');
                    loadAppointments();
                } else {
                    showAlert('Error confirming appointment', 'error');
                }
            } catch (error) {
                showAlert('Error confirming appointment: ' + error.message, 'error');
            }
        }
        
        // Cancel appointment
        async function cancelAppointment(id) {
            if (confirm('Are you sure you want to cancel this appointment?')) {
                try {
                    const response = await fetch(`/api/appointments/${id}`, {
                        method: 'PATCH',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ status: 'cancelled' })
                    });
                    
                    if (response.ok) {
                        showAlert('Appointment cancelled!');
                        loadAppointments();
                    } else {
                        showAlert('Error cancelling appointment', 'error');
                    }
                } catch (error) {
                    showAlert('Error cancelling appointment: ' + error.message, 'error');
                }
            }
        }
        
        // Delete appointment
        async function deleteAppointment(id) {
            if (confirm('Are you sure you want to delete this appointment?')) {
                try {
                    const response = await fetch(`/api/appointments/${id}`, {
                        method: 'DELETE'
                    });
                    
                    if (response.ok) {
                        showAlert('Appointment deleted successfully!');
                        loadAppointments();
                    } else {
                        showAlert('Error deleting appointment', 'error');
                    }
                } catch (error) {
                    showAlert('Error deleting appointment: ' + error.message, 'error');
                }
            }
        }
        
        // Handle form submission
        document.getElementById('appointmentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const formData = {
                customer_name: document.getElementById('appointmentCustomer').value,
                customer_email: document.getElementById('appointmentEmail').value,
                appointment_date: new Date(document.getElementById('appointmentDate').value).toISOString(),
                duration: parseInt(document.getElementById('appointmentDuration').value),
                service_type: document.getElementById('appointmentService').value,
                notes: document.getElementById('appointmentNotes').value,
                status: 'pending'
            };
            
            try {
                let response;
                if (editingId) {
                    response = await fetch(`/api/appointments/${editingId}`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                    editingId = null;
                } else {
                    response = await fetch('/api/appointments', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(formData)
                    });
                }
                
                if (response.ok) {
                    showAlert('Appointment saved successfully!');
                    document.getElementById('appointmentForm').reset();
                    loadAppointments();
                } else {
                    showAlert('Error saving appointment', 'error');
                }
            } catch (error) {
                showAlert('Error saving appointment: ' + error.message, 'error');
            }
        });
        
        // Load appointments on page load
        loadAppointments();
    </script>
</body>
</html>
