<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Profile | LE PETIT VéLO ROUGE</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/layout.css"></head>
  <body data-customer-page="profile">

    <main class="page customer-content">
      <header class="header"><div><p class="eyebrow">LE PETIT VéLO ROUGE</p><h1>Your profile</h1></div></header>

      </section>
    </main>
