<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Login | LE PETIT VéLO ROUGE</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/layout.css"></head>
  <body data-customer-page="login">
    <nav class="home-nav" aria-label="Main navigation"></nav>
    <main class="page customer-content">
      <section class="card">
        <h2>Test profile login</h2>
        <p class="customer-notice">This checks credentials only; it does not sign you in or create a session.</p>
        <p class="muted">Demo credentials: <code>login@example.com</code> / <code>1234</code></p>
        <form id="login-form">
          <label for="login-email">Email</label><input id="login-email" name="email" type="email" autocomplete="username" required>
          <label for="login-password">Password</label><input id="login-password" name="password" type="password" autocomplete="current-password" required>
          <p id="login-message" class="muted" role="status" aria-live="polite"></p><p id="login-error" class="error" role="alert" hidden></p>
          <button id="login-button" type="submit">Test login</button>
        </form>
        <p><a href="signup.html">Create an account</a></p>
      </section>
    </main>
    <footer class="site-footer"></footer>
    <script type="module" src="/components/layout.js"></script>
    <script type="module" src="/controllers/customer_controller.js"></script>
    <script type="module" src="/controllers/auth_controller.js"></script>
  </body>
</html>
