<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Signup | LE PETIT VéLO ROUGE</title><link rel="stylesheet" href="/css/style.css"><link rel="stylesheet" href="/css/layout.css"></head>
  <body data-customer-page="signup">

    <main class="page customer-content">
      <header class="header"><div><p class="eyebrow">LE PETIT VéLO ROUGE</p><h1>Create an account</h1></div></header>

      </section>
    </main>
    <footer class="site-footer"></footer>
    <script type="module" src="/components/layout.js"></script>
    <script type="module" src="/controllers/customer_controller.js"></script>
